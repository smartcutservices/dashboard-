<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Cut Services · Dashboard Impression</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg: #f7f1e7;
      --surface: rgba(255, 255, 255, 0.94);
      --surface-soft: rgba(255, 255, 255, 0.72);
      --text: #1d1b18;
      --muted: #6d6559;
      --accent: #c6a75e;
      --border: rgba(29, 27, 24, 0.08);
      --shadow: 0 24px 60px rgba(31, 30, 28, 0.08);
      --success: #0f9f6e;
      --warning: #d97706;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Manrope', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(198, 167, 94, 0.18), transparent 22%),
        linear-gradient(180deg, #fcf7ee 0%, #f2eadf 100%);
    }

    .shell {
      min-height: 100vh;
      padding: 2rem;
      display: grid;
      gap: 1.25rem;
    }

    .hero,
    .panel,
    .stat-card {
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .hero,
    .panel {
      padding: 1.5rem;
    }

    .hero {
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(248,242,230,0.94));
    }

    .hero small,
    .panel small {
      display: inline-block;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }

    .hero h1,
    .panel h2 {
      margin: 0;
      font-family: 'Cormorant Garamond', serif;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.25rem);
      line-height: 0.92;
    }

    .hero p,
    .panel p {
      color: var(--muted);
      line-height: 1.8;
    }

    .hero p {
      max-width: 74ch;
      margin: 1rem 0 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      padding: 1.1rem 1.15rem;
    }

    .stat-card strong {
      display: block;
      font-size: 1.65rem;
      line-height: 1;
    }

    .stat-card span {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(15, 159, 110, 0.12);
      color: var(--success);
    }

    .status-chip.off {
      background: rgba(217, 119, 6, 0.12);
      color: var(--warning);
    }

    .stack {
      display: grid;
      gap: 1rem;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
    }

    .field,
    .option-list {
      display: grid;
      gap: 0.45rem;
    }

    .field span,
    .option-title {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
    }

    .input,
    .textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.85rem 0.95rem;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .textarea {
      min-height: 104px;
      resize: vertical;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.72);
      border-radius: 999px;
      padding: 0.75rem 1rem;
      width: fit-content;
      font-weight: 700;
    }

    .option-list {
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 1rem;
      background: linear-gradient(180deg, rgba(198,167,94,0.08), rgba(255,255,255,0.92));
    }

    .module-config {
      padding: 0;
      overflow: hidden;
    }

    .module-config__head {
      width: 100%;
      border: 0;
      border-radius: 0;
      padding: 1.2rem 1.35rem;
      background:
        radial-gradient(circle at top right, rgba(198,167,94,0.11), transparent 32%),
        rgba(255,255,255,0.92);
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      text-align: left;
    }

    .module-config__head small {
      margin: 0 0 0.4rem;
    }

    .module-config__head h2 {
      font-size: clamp(1.8rem, 3vw, 2.35rem);
    }

    .module-config__head p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .module-config__status {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .module-config__body {
      padding: 0 1.35rem 1.35rem;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.62);
    }

    .module-config__body > p {
      margin-top: 1rem;
    }

    .delivery-accordion {
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255,255,255,0.82);
      box-shadow: 0 12px 30px rgba(31, 30, 28, 0.05);
      margin-top: 0.85rem;
    }

    .delivery-accordion__head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.95rem 1rem;
      border-radius: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(248,242,230,0.88));
      border: 0;
      color: var(--text);
      text-align: left;
    }

    .delivery-accordion__head strong {
      display: block;
      font-size: 0.98rem;
    }

    .delivery-accordion__head small {
      display: block;
      margin: 0.2rem 0 0;
      color: var(--muted);
      font: 700 0.72rem 'Manrope', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .delivery-accordion__body {
      display: grid;
      gap: 0.8rem;
      padding: 0.95rem;
      background: rgba(255,255,255,0.66);
    }

    .delivery-module-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      padding: 0.75rem;
      border-radius: 16px;
      background: rgba(198,167,94,0.07);
    }

    .delivery-module-meta .hint {
      margin: 0;
      max-width: 86ch;
    }

    .delivery-rule-list {
      display: grid;
      gap: 0.65rem;
    }

    .delivery-rule-row {
      margin-top: 0;
      padding: 0.7rem;
      border: 1px solid rgba(29, 27, 24, 0.06);
      border-radius: 18px;
      background: rgba(255,255,255,0.9);
    }

    .delivery-pagination {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.7rem;
      padding-top: 0.2rem;
    }

    .delivery-pagination span {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .option-row {
      display: grid;
      grid-template-columns: 1.2fr 120px auto auto;
      gap: 0.7rem;
      align-items: center;
      margin-top: 0.7rem;
    }

    .paper-config-list {
      display: grid;
      gap: 1rem;
    }

    .paper-config-card {
      display: grid;
      grid-template-columns: minmax(230px, 0.78fr) minmax(360px, 1.7fr);
      gap: 1rem;
      align-items: start;
      padding: 1rem;
      border: 1px solid rgba(29, 27, 24, 0.08);
      border-radius: 22px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 14px 34px rgba(31, 30, 28, 0.05);
    }

    .paper-config-card__head {
      display: grid;
      gap: 0.7rem;
      align-content: start;
    }

    .paper-config-card__label {
      margin: 0;
    }

    .paper-dimension-table {
      display: grid;
      gap: 0.55rem;
      min-width: 0;
    }

    .paper-dimension-table__head,
    .paper-dimension-row {
      display: grid;
      grid-template-columns: minmax(160px, 1.2fr) minmax(110px, 0.65fr) minmax(82px, auto) auto;
      gap: 0.65rem;
      align-items: center;
    }

    .paper-dimension-table__head {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .paper-config-card > .btn-secondary {
      grid-column: 2;
      justify-self: start;
    }

    .mini-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.75rem 0.8rem;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    button {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.78rem 1rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.46;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--text);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.82);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-danger {
      background: rgba(185, 28, 28, 0.1);
      border-color: rgba(185, 28, 28, 0.16);
      color: #991b1b;
    }

    .hint {
      font-size: 0.82rem;
      color: var(--muted);
    }

    @media (max-width: 1100px) {
      .shell { padding: 1rem; }
      .config-grid,
      .field-grid,
      .option-row,
      .paper-config-card,
      .paper-dimension-table__head,
      .paper-dimension-row {
        grid-template-columns: 1fr;
      }

      .paper-config-card > .btn-secondary {
        grid-column: 1;
        width: 100%;
      }

      .delivery-module-meta,
      .delivery-pagination {
        align-items: stretch;
        flex-direction: column;
      }

      .module-config__head {
        align-items: flex-start;
        flex-direction: column;
      }

      .module-config__status {
        justify-content: space-between;
        width: 100%;
      }

      .delivery-module-meta .btn-secondary,
      .delivery-pagination .btn-secondary {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell" id="printing-dashboard-root"></main>
  <script type="module" src="./dashboard-printing.js?v=20260604-1"></script>
  <script type="module" src="./admin-access.js"></script>
</body>
</html>
