<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Cut Services - Devise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--bg:#f7f3eb;--card:#fffdf8;--text:#171614;--muted:#6f675c;--gold:#c6a75e;--border:rgba(23,22,20,.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Manrope,sans-serif;background:linear-gradient(180deg,#fbf8f1,#f1eadc);color:var(--text);min-height:100vh;padding:clamp(1rem,3vw,2rem)}
    .shell{max-width:980px;margin:0 auto;display:grid;gap:1rem}
    .hero,.card{border:1px solid var(--border);background:rgba(255,253,248,.9);border-radius:28px;box-shadow:0 24px 60px rgba(23,22,20,.08);padding:clamp(1.2rem,3vw,2rem)}
    small{color:#9b7c38;text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:800}
    h1,h2{font-family:"Cormorant Garamond",serif;line-height:.95}
    h1{font-size:clamp(2.6rem,6vw,4.6rem);margin:.5rem 0}
    h2{font-size:clamp(2rem,4vw,3rem)}
    p{color:var(--muted);line-height:1.75}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1rem}
    .field{display:grid;gap:.45rem}
    .input{width:100%;border:1px solid var(--border);border-radius:16px;background:#fff;padding:1rem;font:inherit}
    .toggle{display:flex;align-items:center;gap:.65rem;margin-top:1rem;font-weight:800}
    .actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem}
    button{border:none;border-radius:999px;padding:.95rem 1.2rem;font:inherit;font-weight:900;cursor:pointer}
    .primary{background:#171614;color:#fff}
    .secondary{background:#fff;border:1px solid var(--border);color:#171614}
    .preview{display:grid;gap:.5rem;margin-top:1rem;padding:1rem;border-radius:20px;background:rgba(198,167,94,.09);border:1px solid rgba(198,167,94,.16)}
    .toast{position:fixed;right:20px;bottom:20px;background:#0f9f6e;color:#fff;padding:.9rem 1rem;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.18);font-weight:800}
    @media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell" id="currency-dashboard-root"></main>
  <script type="module" src="./dashboard-currency.js?v=20260529-2"></script>
  <script type="module" src="./admin-access.js"></script>
</body>
</html>
