<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Cut Health · Administration</title><style>body{margin:0;font:15px Arial;background:#f4f7f6;color:#102a2a}main{max-width:1200px;margin:auto;padding:24px}h1{margin:0 0 6px}p{color:#55706d}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{border:1px solid #b9d7d0;background:#fff;border-radius:8px;padding:10px 14px;cursor:pointer}.tabs button.active{background:#0d7665;color:#fff}.panel{background:#fff;border:1px solid #d7e5e2;border-radius:12px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{padding:14px;background:#edf7f4;border-radius:10px}.stat strong{display:block;font-size:26px}.row{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0ef}.row:last-child{border:0}.badge{padding:5px 8px;border-radius:999px;background:#eef2f1;font-size:12px}.actions button{margin-left:6px;border:0;border-radius:7px;padding:7px 10px;cursor:pointer}.approve{background:#0d7665;color:#fff}.reject{background:#f1ddd8;color:#8e2c21}.field{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field label{display:grid;gap:5px;font-size:13px}.field input{padding:9px;border:1px solid #cbd9d6;border-radius:7px;width:120px}#notice{min-height:22px;color:#0d7665}</style></head><body><main><h1>Smart Cut Health</h1><p>Validation des professionnels, tarifs et suivi des téléconsultations.</p><div class="tabs"><button class="active" data-tab="overview">Vue d’ensemble</button><button data-tab="applications">Candidatures</button><button data-tab="pricing">Tarifs & commissions</button><button data-tab="consultations">Consultations</button></div><div id="notice"></div><section id="overview" class="tab"><div class="grid"><div class="stat"><span>Candidatures à revoir</span><strong id="pendingCount">—</strong></div><div class="stat"><span>Professionnels vérifiés</span><strong id="verifiedCount">—</strong></div><div class="stat"><span>Consultations</span><strong id="consultationCount">—</strong></div><div class="stat"><span>Remboursements Wallet</span><strong id="refundCount">—</strong></div></div></section><section id="applications" class="tab" hidden><div class="panel"><h2>Candidatures professionnelles</h2><div id="applicationsList">Chargement…</div></div></section><section id="pricing" class="tab" hidden><div class="panel"><h2>Tarifs par spécialité</h2><div id="pricingList">Chargement…</div></div></section><section id="consultations" class="tab" hidden><div class="panel"><h2>Suivi des consultations</h2><div id="consultationsList">Chargement…</div></div></section></main><script type="module" src="./health-admin.js"></script><script type="module" src="./admin-access.js"></script></body></html>
