<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tickets & Championnats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./dashboard-jwetpro-tickets.css?v=20260820-2">
</head>
<body><main class="page">
  <header class="hero"><div><p class="eyebrow">Module financier</p><h1>Tickets & Championnats</h1><p>Suivi des inscriptions JwetPro, commissions Smart Cut, crédits et reversements.</p></div><div class="hero-actions"><button id="export-btn" class="button secondary">Exporter le rapport</button><button id="refresh-btn" class="button secondary">Actualiser</button></div></header>
  <section class="settings panel"><div><h2>Configuration</h2><p>Le drapeau reste désactivé jusqu’au test complet du championnat privé.</p></div><label class="toggle"><input id="enabled-input" type="checkbox"><span>Intégration active</span></label><label>Taux global (%)<input id="rate-input" type="number" min="0" max="100" step="0.1" value="10"></label><button id="save-settings-btn" class="button">Enregistrer</button></section>
  <section class="stats" id="stats"></section>
  <section class="panel filters"><input id="search-input" type="search" placeholder="Rechercher championnat, joueur, référence MonCash..."><select id="status-filter"><option value="">Tous les statuts</option><option value="paid">Payé</option><option value="pending">En attente</option><option value="failed">Échoué</option></select><input id="date-filter" type="date"></section>
  <section class="content-grid"><div class="panel"><div class="panel-title"><div><h2>Championnats et ventes</h2><span id="result-count"></span></div></div><div id="championship-list" class="championship-list"><p class="empty">Chargement...</p></div></div><aside class="panel"><h2>Alertes</h2><div id="alerts" class="alerts"></div><h2>Crédits réutilisés</h2><div id="credits" class="payouts"></div><h2>Reversements</h2><div id="payouts" class="payouts"></div></aside></section>
</main><script type="module" src="./dashboard-jwetpro-tickets.js?v=20260820-2"></script><script type="module" src="./admin-access.js"></script></body></html>
